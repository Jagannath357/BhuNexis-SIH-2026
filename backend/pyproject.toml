[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bhunexis-backend"
version = "1.0.0"
description = "BhuNexis FastAPI Backend Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "geoalchemy2",
    "shapely",
    "pydantic",
    "pydantic-settings",
    "bcrypt",
    "pyjwt",
    "python-multipart",
    "httpx",
    "alembic",
    "pytest",
    "email-validator"
]

[tool.setuptools.packages.find]
where = ["."]
