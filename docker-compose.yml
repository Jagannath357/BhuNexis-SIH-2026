version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: bhunexis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bhunexisadmin
      MINIO_ROOT_PASSWORD: bhunexispassword123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
